# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: "../src/"

    App\Service\CartManager:
        arguments:
            $senderEmail: '%env(MAILER_FROM)%'

    App\EventListener\OrderStatusListener:
        arguments:
            $senderEmail: '%env(MAILER_FROM)%'

    # Stockage des sessions via l'URL de base de donnees (PdoSessionHandler gere le parsing postgresql:// automatiquement)
    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '%env(DATABASE_URL)%'
            - { db_table: 'sessions', db_id_col: 'sess_id', db_data_col: 'sess_data', db_time_col: 'sess_time', db_lifetime_col: 'sess_lifetime' }

    # Client S3 pour Supabase Storage
    Aws\S3\S3Client:
        arguments:
            - version: 'latest'
              region: '%env(SUPABASE_REGION)%'
              endpoint: '%env(SUPABASE_ENDPOINT)%'
              use_path_style_endpoint: true
              credentials:
                  key: '%env(SUPABASE_ACCESS_KEY)%'
                  secret: '%env(SUPABASE_SECRET_KEY)%'
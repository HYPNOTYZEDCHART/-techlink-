databases:
  # 1. Base de données PostgreSQL managée
  - name: techlink-db
    plan: free
    postgresMajorVersion: 16

services:

  # 2. Application Web Docker
  - type: web
    name: techlink-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techlink-db
          property: connectionString
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: '1'
      - key: APP_SECRET
        generateValue: true
